name: 日常领取（示例）
description: 进日常界面，反复点"一键领取/领取"，下滑翻页，直到出现"已完成"
# 需要准备：main/home.png、main/daily_entry.png、daily/claim_all.png、
#           daily/claim.png、daily/finished.png
steps:
  - action: wait_template
    template: main/home.png
    timeout: 120
  - action: click_template
    template: main/daily_entry.png
    timeout: 15
  - action: sleep
    seconds: 2

  - action: loop
    times: 10
    max_minutes: 15
    steps:
      - action: click_any
        templates: [daily/claim_all.png, daily/claim.png]
        timeout: 3
        required: false
      - action: break_if_template
        template: daily/finished.png
      - action: swipe
        from: [0.5, 0.78]
        to: [0.5, 0.30]
        duration_ms: 500
      - action: sleep
        seconds: [0.8, 1.5]

  - action: back
  - action: screenshot
    name: daily_done
